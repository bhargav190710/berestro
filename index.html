<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Golden Fork | Indian Gourmet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
</head>
<body class="bg-stone-50 text-stone-900 font-sans pb-32">

    <div id="auth-modal" class="fixed inset-0 bg-stone-900/95 z-[100] flex items-center justify-center p-4">
        <div class="bg-white rounded-[3.5rem] p-10 max-w-sm w-full shadow-2xl text-center">
            <div class="bg-orange-100 w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-6">
                <span class="text-4xl">🇮🇳</span>
            </div>
            <h2 class="text-3xl font-black mb-2">Golden Fork</h2>
            <p class="text-stone-500 mb-8 italic text-sm">Sign in to start your order.</p>
            <div class="flex flex-col gap-3">
                <button id="googleBtn" class="w-full flex items-center justify-center gap-3 bg-white border-2 border-stone-200 py-4 rounded-2xl font-bold hover:border-orange-500 transition-all active:scale-95 shadow-sm">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/action/google.svg" class="w-6 h-6">
                    Sign in with Google
                </button>
                <button onclick="enterAsGuest()" class="w-full py-3 rounded-2xl font-bold text-stone-400 hover:text-stone-600 transition-colors text-sm">
                    Skip for now, browse as Guest
                </button>
            </div>
        </div>
    </div>

    <div id="main-content" class="blur-bg">
        <nav class="flex justify-between items-center px-6 py-4 bg-white/90 backdrop-blur-md border-b sticky top-0 z-50">
            <h1 class="text-xl font-black text-orange-600 tracking-tighter uppercase">Golden Fork</h1>
            <div id="user-profile" class="hidden flex items-center gap-2 bg-stone-100 rounded-full pr-3">
                <img id="user-pic" class="w-8 h-8 rounded-full border border-white">
                <button onclick="logout()" class="text-[10px] font-bold text-red-500 uppercase">Logout</button>
            </div>
        </nav>

        <main class="py-8">
            <section id="section-biryani" class="mb-10"></section>
            <section id="section-veg" class="mb-10"></section>
            <section id="section-nonVeg" class="mb-10"></section>
        </main>
    </div>

    <div id="floating-cart" class="fixed bottom-8 left-4 right-4 z-50">
        <button onclick="toggleCart()" class="w-full bg-stone-900 text-white p-5 rounded-[2.2rem] shadow-2xl flex justify-between items-center px-8">
            <div class="flex items-center gap-3">
                <div class="bg-orange-600 text-white text-xs font-black rounded-full w-6 h-6 flex items-center justify-center" id="mobile-count">0</div>
                <span class="font-bold text-sm tracking-widest">VIEW CART</span>
            </div>
            <span class="font-black text-lg" id="mobile-total">₹0</span>
        </button>
    </div>

    <div id="cart-modal" class="fixed inset-0 bg-black/60 z-[110] hidden flex items-end justify-center">
        <div class="bg-white w-full max-w-md rounded-t-[3rem] p-8 shadow-2xl">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-black">Cart Summary</h2>
                <button onclick="toggleCart()" class="text-stone-300 text-4xl">&times;</button>
            </div>
            <div id="cart-items-list" class="space-y-4 max-h-[40vh] overflow-y-auto mb-6 no-scrollbar"></div>
            <div class="flex justify-between font-black text-xl border-t pt-4 mb-6">
                <span>Total</span>
                <span id="total-price">₹0</span>
            </div>
            <button id="placeOrderBtn" onclick="placeOrder()" class="w-full bg-orange-600 text-white py-4 rounded-2xl font-bold">Place Order</button>
        </div>
    </div>

    <script src="menuData.js"></script>
    <script src="script.js"></script>
</body>
</html>
